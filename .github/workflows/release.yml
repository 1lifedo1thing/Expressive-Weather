name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "KEYSTORE_PATH=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew testPlayDebugUnitTest testGithubDebugUnitTest

      - name: Build GitHub Release APK and Play Release AAB
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_CONFIG: "true"
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          ./gradlew assembleGithubRelease bundlePlayRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: expressive-weather-release
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt
            app/build/outputs/mapping/githubRelease/mapping.txt

      - name: Determine release channel (< 1.0.0 is pre-release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          MAJOR="${VER%%.*}"
          MAJOR="${MAJOR%%-*}"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && (( MAJOR < 1 )); then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$VER" =~ -(alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/github/release/*.apk
