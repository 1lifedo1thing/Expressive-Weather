name: Bug Report
description: Report a crash, incorrect weather/alert data, or UI issue
labels: ["bug"]
body:
  - type: dropdown
    id: flavor
    attributes:
      label: Distribution Flavor
      options:
        - Google Play (play)
        - GitHub Release (github)
        - Self-built from source
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: "e.g. Pixel 9 Pro, Android 16"
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region / City (optional, avoid exact private address)
      placeholder: "e.g. Tokyo, Japan / Seattle, US / Paris, France"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
